<!DOCTYPE html>
<html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Құндылықты қимылмен көрсет</title><style>
:root{font-family:Arial,sans-serif;color:#103c69;background:#edf6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 65% 30%,#fff9e8,transparent 60%),linear-gradient(135deg,#e0f4ff,#f5f9fb)}button,select{font:inherit}button{cursor:pointer;border:1px solid #b7d0e2;background:#fffaf0;color:#123e68;padding:14px 22px;border-radius:16px;font-size:clamp(16px,1.5vw,24px);font-weight:700;min-height:54px;box-shadow:0 4px 0 #c5d6df;transition:background .2s}button:hover{background:#d7edf9}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible{outline:4px solid #c48b21;outline-offset:5px}.primary{background:#174d82;color:white;border-color:#174d82;box-shadow:0 5px 0 #0b3058}.primary:hover{background:#21649f}.gold{color:#9a691b}.app{max-width:1600px;min-height:100vh;margin:auto;padding:25px 4vw;display:flex;flex-direction:column;position:relative}.app:before,.app:after{content:'❖';position:absolute;font-size:180px;color:#c89c48;opacity:.12;pointer-events:none;top:24%;left:-20px}.app:after{left:auto;right:0;top:60%}header{display:flex;align-items:center;justify-content:space-between;gap:15px;z-index:1}.brand{font-size:clamp(18px,1.8vw,28px);font-weight:800;letter-spacing:.04em}.tools{display:flex;gap:12px}.screen{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative;z-index:1;padding:20px 0}.eyebrow{font-size:clamp(18px,2vw,30px);color:#47718a;margin:0 0 14px}h1{font-size:clamp(38px,5.2vw,78px);line-height:1.08;letter-spacing:-.025em;margin:10px auto 24px;max-width:1150px}h2{font-size:clamp(40px,5vw,76px);margin:10px 0}.tag{font-size:clamp(22px,2.5vw,38px);margin:0 0 26px}.settings{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin:22px 0 30px}.setting{background:#ffffffa8;border:1px solid #d0e2ee;border-radius:20px;padding:16px 24px;text-align:left}.setting label{display:block;font-size:20px;margin-bottom:9px}select{padding:12px;border-radius:12px;border:1px solid #a4c5db;background:white;color:#103c69;font-size:22px}.start{padding:20px 65px;font-size:30px}.icons{display:flex;justify-content:center;gap:24px;margin:16px 0 24px}.icons span{font-size:48px;background:#ffffffb3;border:1px solid #dae7ec;border-radius:24px;padding:18px;box-shadow:0 12px 30px #24558412}.lesson{margin-top:16px;color:#537489;font-size:18px}.stage{display:grid;grid-template-columns:1fr 1.15fr;align-items:center;gap:30px;text-align:left}.stage-copy h2{margin-bottom:25px}.instruction{font-size:clamp(28px,3vw,46px);line-height:1.3}.visual{background:radial-gradient(ellipse,#fff6d6,#d8effc);border:1px solid #fff;border-radius:42px;box-shadow:0 20px 65px #1c4e7520;overflow:hidden}.visual svg{width:100%;height:auto;display:block;max-height:440px}.timer{font-size:30px;font-weight:700;margin-top:30px}.track{height:10px;border-radius:10px;background:#ccdfec;overflow:hidden;margin-top:12px;max-width:400px}.fill{height:100%;background:#be903b;width:100%}.footer{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}.steps{display:flex;justify-content:center;gap:10px;align-items:center;font-size:24px;margin:18px}.dot{width:10px;height:10px;border-radius:50%;background:#c1d8e8}.dot.active{background:#bd8b30}.count{font-size:150px;color:#174d82;margin:15px}.pledge{font-size:clamp(34px,4.7vw,70px);line-height:1.4;font-weight:800;margin:18px 0}.pledge span{display:block;animation:shine 6s infinite}.pledge span:nth-child(2){animation-delay:2s}.pledge span:nth-child(3){animation-delay:4s}@keyframes shine{0%,30%,100%{color:#103c69}15%{color:#a87720;text-shadow:0 0 25px #edcb77}}.arm,.head{transform-box:fill-box;transform-origin:top center}.wave{animation:wave 2.5s ease-in-out infinite;transform-origin:bottom center}.bow{animation:bow 3s ease-in-out infinite}.heart{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.join-left{animation:joinL 3s ease-in-out infinite}.join-right{animation:joinR 3s ease-in-out infinite}.paused *{animation-play-state:paused!important}@keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(18deg)}}@keyframes bow{0%,100%{transform:rotate(0)}45%,65%{transform:rotate(12deg)}}@keyframes pulse{50%{transform:scale(1.12);opacity:.85}}@keyframes joinL{0%,100%{transform:translateX(-10px)}50%{transform:translateX(3px)}}@keyframes joinR{0%,100%{transform:translateX(10px)}50%{transform:translateX(-3px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:750px){.app{padding:18px}.stage{grid-template-columns:1fr;text-align:center;gap:10px}.visual svg{max-height:280px}.timer{margin-top:10px}.track{margin:10px auto}.tools button{padding:10px;font-size:14px}.brand{font-size:16px}.settings{gap:12px}.setting{padding:12px}.icons span{font-size:36px;padding:12px}.footer button{padding:12px}.pledge{font-size:34px}}@media(min-width:1000px) and (max-height:800px){.app{padding-top:15px;padding-bottom:15px}h1{font-size:60px}.icons{margin:8px}.icons span{padding:12px}.settings{margin:14px 0}.visual svg{max-height:350px}.footer{margin-top:14px}}
</style></head><body><div class="app"><header><div class="brand">ӨМІРЛІК <span class="gold">ҚҰНДЫЛЫҚТАР</span></div><div class="tools"><button id="sound" aria-pressed="false">Дыбыс: өшірулі</button><button id="fullscreen">Толық экран</button></div></header><main id="screen" class="screen" aria-live="polite"></main></div><script>
'use strict';
const screen=document.getElementById('screen');
const values=[{name:'МЕЙІРІМ',icon:'❤️',instruction:'Алақаныңды жүрек тұсына қой',kind:'heart'},{name:'ДОСТЫҚ',icon:'🤝',instruction:'Жаныңдағы оқушыға қол бұлға',kind:'wave'},{name:'ҚҰРМЕТ',icon:'🌷',instruction:'Бір-біріңе қарап, бастарыңды сәл иіңдер',kind:'bow'},{name:'БІРЛІК',icon:'✨',instruction:'Екі қолыңды біріктір',kind:'join'}];
let duration=10,mode='auto',state='home',index=0,paused=false,remaining=0,timer=null,last=0,sound=false,audio=null;
function clearTimer(){if(timer!==null)clearInterval(timer);timer=null;}
function beep(){if(!sound||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(660,audio.currentTime);o.frequency.exponentialRampToValueAtTime(880,audio.currentTime+.12);g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.12,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.3);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.32);}
function person(x,kind,flip=false){let arms='';if(kind==='wave')arms='<path d="M-39 165 L-65 225"/><g class="wave"><path d="M39 165 L66 119 L66 82"/><circle cx="66" cy="77" r="12" fill="#e9b98d" stroke="none"/></g>';else if(kind==='bow')arms='<path d="M-39 165 L-49 232 M39 165 L49 232"/>';else if(kind==='join')arms='<g class="join-left"><path d="M-39 165 L-48 207 L-4 174"/><ellipse cx="-5" cy="171" rx="8" ry="17" fill="#e9b98d" stroke="none"/></g><g class="join-right"><path d="M39 165 L48 207 L4 174"/><ellipse cx="5" cy="171" rx="8" ry="17" fill="#e9b98d" stroke="none"/></g>';else arms='<path d="M-39 165 L-50 222 M39 165 L51 203 L4 167"/><ellipse cx="2" cy="166" rx="13" ry="9" fill="#e9b98d" stroke="none"/>';
return `<g transform="translate(${x},0)"><g ${flip?'transform="translate(0,0) scale(-1,1)"':''}><ellipse cx="0" cy="325" rx="74" ry="12" fill="#153e69" opacity=".1"/><path d="M-21 239 L-25 309 M21 239 L25 309" stroke="#193c65" stroke-width="29" stroke-linecap="round"/><path d="M-26 314 L-42 314 M26 314 L42 314" stroke="#102c4c" stroke-width="17" stroke-linecap="round"/><path d="M-38 145 Q0 132 38 145 L34 244 L-34 244Z" fill="#fff"/><path d="M-25 143 L0 188 L25 143 L31 244 L-31 244Z" fill="#28588c"/><path d="M0 145 L-7 157 L0 181 L7 157Z" fill="#d5a448"/><rect x="-12" y="118" width="24" height="27" rx="9" fill="#e9b98d"/><g class="head ${kind==='bow'?'bow':''}"><ellipse cx="0" cy="90" rx="39" ry="45" fill="#e9b98d"/><path d="M-39 89 Q-49 36 0 39 Q44 38 40 84 L25 66 Q5 77 -24 64Z" fill="#243345"/><circle cx="-13" cy="90" r="3.5" fill="#25354a"/><circle cx="13" cy="90" r="3.5" fill="#25354a"/><path d="M-10 108 Q0 117 10 108" fill="none" stroke="#9d574a" stroke-width="3" stroke-linecap="round"/></g><g fill="none" stroke="#e9b98d" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">${arms}</g></g></g>`;}
function visual(v){const pair=v.kind==='wave'||v.kind==='bow';return `<div class="visual${paused?' paused':''}"><svg viewBox="0 0 600 360" role="img" aria-label="${v.instruction}"><ellipse cx="300" cy="195" rx="215" ry="140" fill="#ffffff" opacity=".3"/>${pair?person(185,v.kind)+person(415,v.kind,true):person(300,v.kind)}${v.kind==='heart'?'<path class="heart" d="M295 177 C262 151 279 133 295 149 C311 133 328 151 295 177Z" fill="#ec6b78"/>':''}${v.kind==='join'?'<g fill="#d6a746"><path d="M300 18 L303 29 L314 32 L303 35 L300 46 L297 35 L286 32 L297 29Z"/><circle cx="235" cy="120" r="4"/><circle cx="370" cy="150" r="5"/></g>':''}</svg></div>`;}
function home(){clearTimer();state='home';paused=false;screen.innerHTML=`<p class="eyebrow">Сергіту сәті</p><h1>Құндылықты<br><span class="gold">қимылмен көрсет</span></h1><p class="tag">Құндылықты таны — қимылмен көрсет!</p><div class="icons" aria-hidden="true"><span>❤️</span><span>🤝</span><span>🌷</span><span>✨</span></div><div class="settings"><div class="setting"><label for="mode">Өткізу режимі</label><select id="mode"><option value="auto">Автоматты</option><option value="teacher">Мұғалім басқарады</option></select></div><div class="setting"><label for="duration">Әр қимылдың уақыты</label><select id="duration"><option value="8">8 секунд</option><option value="10">10 секунд</option><option value="15">15 секунд</option></select></div></div><div><button class="primary start" data-action="start">Бастау</button></div><div class="lesson">Қазақ тілі · 8-сынып · Өмірлік құндылықтар</div>`;document.getElementById('mode').value=mode;document.getElementById('duration').value=duration;document.getElementById('duration').disabled=mode==='teacher';document.getElementById('mode').onchange=e=>{mode=e.target.value;document.getElementById('duration').disabled=mode==='teacher';};document.getElementById('duration').onchange=e=>duration=Number(e.target.value);}
function start(){clearTimer();paused=false;if(!audio){const Audio=window.AudioContext||window.webkitAudioContext;if(Audio)audio=new Audio();}if(audio)audio.resume().catch(()=>{});state='prep';remaining=3;screen.innerHTML='<h2>Орнымыздан тұрып,<br>бірге қимылдайық!</h2><div class="count" id="count">3</div><div><button data-action="home">Басына оралу</button></div>';last=performance.now();timer=setInterval(()=>{const now=performance.now();remaining-=(now-last)/1000;last=now;if(remaining<=0)stage(0);else document.getElementById('count').textContent=Math.ceil(remaining);},50);}
function stage(i){clearTimer();if(i>3){finish();return;}index=Math.max(0,i);state='stage';paused=false;remaining=duration;const v=values[index];screen.innerHTML=`<div class="stage"><div class="stage-copy"><p class="eyebrow">Құндылықты таны — қимылмен көрсет!</p><h2>${v.icon} ${v.name}</h2><div class="instruction">${v.instruction}</div>${mode==='auto'?'<div class="timer"><span id="time"></span> секунд<div class="track"><div class="fill" id="fill"></div></div></div>':'<p class="eyebrow" style="margin-top:30px">Бірге қайталайық!</p>'}</div>${visual(v)}</div><div class="steps">${values.map((_,j)=>`<span class="dot ${j===index?'active':''}"></span>`).join('')}<span style="margin-left:12px">${index+1} / 4</span></div><div class="footer"><button data-action="prev" ${index===0?'disabled':''}>Алдыңғы</button>${mode==='auto'?'<button data-action="pause" id="pause">Кідірту</button>':''}<button class="primary" data-action="next">Келесі</button><button data-action="home">Басына оралу</button></div>`;beep();if(mode==='auto'){updateTime();last=performance.now();timer=setInterval(tick,50);}}
function updateTime(){document.getElementById('time').textContent=Math.ceil(Math.max(0,remaining));document.getElementById('fill').style.width=Math.max(0,remaining/duration*100)+'%';}
function tick(){const now=performance.now();if(!paused){remaining-=(now-last)/1000;if(remaining<=0){stage(index+1);return;}updateTime();}last=now;}
function togglePause(){if(state!=='stage'||mode!=='auto')return;paused=!paused;last=performance.now();document.querySelector('.visual').classList.toggle('paused',paused);document.getElementById('pause').textContent=paused?'Жалғастыру':'Кідірту';}
function finish(){clearTimer();state='end';paused=false;beep();screen.innerHTML='<div class="icons" aria-hidden="true"><span>❤️</span><span>🤝</span><span>✨</span></div><p class="eyebrow">Бәріміз бірге айтайық!</p><div class="pledge"><span>Бір-бірімізді тыңдаймыз,</span><span>құрметтейміз,</span><span>қолдаймыз!</span></div><div class="footer"><button class="primary" data-action="start">Қайта орындау</button><button data-action="home">Басты экран</button></div>';}
screen.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='start')start();if(a==='home')home();if(a==='next'&&state==='stage')stage(index+1);if(a==='prev'&&state==='stage'&&index>0)stage(index-1);if(a==='pause')togglePause();});
document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent='Дыбыс: '+(sound?'қосулы':'өшірулі');document.getElementById('sound').setAttribute('aria-pressed',String(sound));};
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.getElementById('fullscreen').textContent='Толық экран үшін F11';}}
document.getElementById('fullscreen').onclick=fullscreen;document.addEventListener('fullscreenchange',()=>document.getElementById('fullscreen').textContent=document.fullscreenElement?'Экраннан шығу':'Толық экран');
document.addEventListener('keydown',e=>{if(['SELECT','BUTTON','INPUT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'&&state==='stage'){e.preventDefault();stage(index+1);}if(e.key==='ArrowLeft'&&state==='stage'&&index>0){e.preventDefault();stage(index-1);}if(e.code==='Space'){e.preventDefault();if(state==='home'||state==='end')start();else togglePause();}if(e.key==='Home'){e.preventDefault();home();}if(e.key.toLowerCase()==='f')fullscreen();});home();
</script></body></html>
